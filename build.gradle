plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.idorbola.checker'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2023.12.1'
    implementation 'com.google.code.gson:gson:2.10.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

shadowJar {
    archiveClassifier.set('')
    archiveFileName.set("idor-bola-checker-${version}.jar")
    manifest {
        attributes 'Burp-Extension-Class': 'com.idorbola.checker.IdorBolaExtension'
    }
}

build.dependsOn shadowJar
